# DARK ROOM BACKUP on the real aircraft (mission_fsm_darkroom_backup):
# pad -> window marker -> window -> slow landing inside. Only the parts that
# flight flies, with the values from hw_full.yaml. Loaded by the node:
#   ros2 run drone_testing mission_fsm_darkroom_backup --ros-args --params-file \
#     $(ros2 pkg prefix drone_testing)/share/drone_testing/config/hw_darkroom_backup.yaml
# (mission_fsm_darkroom_backup.launch.py agent_only:=false loads it too.)
/**:
  ros__parameters:
    # THE PILOT OWNS MODE AND ARMING (as hw_full.yaml).
    request_offboard_from_ros: false
    arm_from_ros: false

    lateral_source: flow          # PMW3901 optical flow (x/y) + TFmini (z)
    rangefinder_checks: true

    # ---- ArUco ids -----------------------------------------------------
    window_marker_id: 0           # the SECOND ArUco, 1.67 m from the wall.
                                  # The climb holds on this id too (the pad).
    pad_marker_id: 1              # NOT 0: MissionFSM refuses to start if it
                                  # equals window_marker_id. Unused here.
    marker_ignore_distance: 3.0   # m of the leg before a marker counts: the
                                  # leg starts over the pad, which is id 0 too

    # ---- the course ----------------------------------------------------
    cruise_altitude: 2.50         # climb + the carpet-track leg
    outbound_distance: 9.3        # LIMIT for that leg
    window_altitude_m: 1.75
    window_offset: 0.15           # m LEFT, marker -> blue window axis
    window_offset_direction: left
    standoff_distance: 1.67
    inside_distance: 0.80         # m past the window plane: where it lands
    max_altitude: 3.0
    flight_seconds: 360.0

    # ---- the blue window: 60 x 60 cm opening --------------------------
    color: blue
    window_min_size: 0.45
    window_max_size: 0.80
    traverse_centre_offset: 0.07  # m ABOVE the window centre (hw_full's). 0.10
                                  # leaves the lidar plane 6.5 cm under the top
                                  # edge and the gap cue is lost on the approach.
    window_sweep_deg: 0.0
    window_backoff: 0.30
    window_max_backoffs: 2
    recentre_backoff: 0.30
    recentre_max_backoffs: 2
    backoff_budget: 2
    backoff_speed: 0.15

    # ---- RealSense (window camera) mounting ----------------------------
    cam_x: 0.105
    cam_y: 0.0
    cam_z: -0.04
    cam_roll: 0.0
    cam_pitch: 0.0
    cam_yaw: 0.0

    # ---- the carpet track (as hw_full.yaml) -----------------------------
    follow_line: true
    track_speed: 0.6
    track_max_lat: 0.30
    track_max_yaw: 0.50
    track_vertical_tol_deg: 10.0
    line_trust: 0.80
    track_width_m: 0.60
    track_width_tol: 0.25
    track_hfov_deg: 59.2          # calibrated (70.4 was a guess)
    track_lane_guard: 0.60

    # ---- speeds (as hw_full.yaml) ---------------------------------------
    leg_speed: 0.6                # straight leg (strafe is capped at 0.25)
    traverse_speed: 0.6           # m/s through the window
    approach_speed: 0.30

    # ---- the sill: crossing on vertical velocity, then the floor check -
    crossing_vz_hold: true
    crossing_height_grace: 5.0
    crossing_settle_s: 1.0
    floor_confirm_s: 1.0
    floor_agree_m: 0.15
    floor_spread_m: 0.05
    floor_wait_s: 20.0
    slow_land_speed: 0.10
